[build-system]
requires = ["setuptools>=75.8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sota-downloader"
version = "2.0.0"
description = "A modular, terminal-based media extraction tool optimized for Android/Termux."
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "you@example.com"}
]
keywords = [
    "media",
    "downloader",
    "yt-dlp",
    "termux",
    "android",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Android",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "yt-dlp>=2026.07.04",
    "rich>=13.7.1",
    "mutagen>=1.47.0",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.0.0",
    "tenacity>=8.5.0",
    "psutil>=6.0.0",
    "requests>=2.32.3",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
sota = "main:main_menu"

[tool.setuptools.packages.find]
include = [
    "config",
    "config.*",
    "core",
    "core.*",
    "ui",
    "ui.*",
    "utils",
    "utils.*",
    "infrastructure",
    "infrastructure.*",
]
exclude = [
    "tests",
    "tests.*",
]

[tool.setuptools.package-data]
infrastructure = ["adapters/*.py"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
    ".git",
    "__pycache__",
    "*.pyc",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "S",   # flake8-bandit
    "I",   # isort
]
ignore = [
    "S101",   # assert
    "S104",   # possible binding to all interfaces
]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "ui", "utils", "infrastructure"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["config", "core", "ui", "utils", "infrastructure"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
