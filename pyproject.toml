[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sota-downloader"
version = "2.0.0"
description = "A modular, terminal-based media extraction tool optimized for Android/Termux."
authors = [{name = "FJ-Cyberzilla", email = "cyberzilla.systems@gmail.com"}]
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.10"
keywords = ["downloader", "media", "termux", "async", "cli"]
dependencies = [
    "yt-dlp>=2026.07.04",
    "rich>=13.7.1",
    "pydantic>=2.8.2",
    "tenacity>=8.5.0",
    "requests>=2.32.3",
    "structlog>=24.4.0",
    "platformdirs>=4.3.0",
    "cryptography>=49.0.0; sys_platform != 'android'"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/FJ-cyberzilla/sota-downloader"
Issues = "https://github.com/FJ-cyberzilla/sota-downloader/issues"
Documentation = "https://github.com/FJ-cyberzilla/sota-downloader/blob/master/docs/userguide.md"

[project.optional-dependencies]
mobile = ["qrcode>=7.4.2"]
ui = ["qrcode>=7.4.2"]
full = [
    "cryptography>=49.0.0"
]

[project.scripts]
sota = "sota_dl.main:main_menu"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sota_dl*"]

[tool.setuptools]
py-modules = ["sota_dl.main"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "S"]
ignore = ["S105", "S603"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]
"ui/menus.py" = ["S608"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
explicit_package_bases = true

# Strict 'Any' checks
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_subtyped_by_any = true

[[tool.mypy.overrides]]
module = [
    "psutil",
    "yt_dlp",
    "yt_dlp.utils",
    "pywidevine.*",
    "video_download_drm",
    "browser_cookie3",
    "pybalt",
    "pybalt.core.exceptions",
    "win32crypt",
    "requests"
]
ignore_missing_imports = true
